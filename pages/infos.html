<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penny Juice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <script src="../script.js"></script>
</head>
<body>
    <nav class="navbar">
        <img src="/assets/img/logo.png" alt="Logo Penny Juice" class="logo">
    </nav>
    <main class="infos-page">
        <div class="infos-top">
            <a href="../index.html" class="back-btn">Retour</a>
        </div>
        <form id="checkout-form" novalidate>
            <div class="form-error" aria-live="polite" style="display:none;color:#a00;margin-bottom:12px"></div>
            <div class="infos-grid">
            <section class="infos-personal">
                <h2>INFORMATIONS PERSONNELLES</h2>
                <div class="form-row two-cols">
                    <label>Prénom
                        <input name="firstName" type="text" placeholder="John">
                    </label>
                    <label>Nom
                        <input name="lastName" type="text" placeholder="Doe">
                    </label>
                </div>
                <div class="form-row two-cols">
                    <label>Entreprise / Association
                        <input name="company" type="text" placeholder="Université de Sherbrooke">
                    </label>
                    <label>Téléphone
                        <input name="phone" type="tel" placeholder="819 821-8000">
                    </label>
                </div>
                <div class="form-row">
                    <label>Adresse mail
                        <input name="email" type="email" placeholder="john.doe@usherbrooke.ca">
                    </label>
                </div>
            </section>

            <section class="infos-delivery">
                <h2>INFORMATIONS LIVRAISON</h2>
                <div class="form-row">
                    <label>Adresse
                        <input name="address" type="text" placeholder="2500 Boulevard de l'Université">
                    </label>
                </div>
                <div class="form-row three-cols">
                    <label>Ville
                        <input name="city" type="text" placeholder="Sherbrooke">
                    </label>
                    <label>Province
                        <input name="province" type="text" placeholder="QC">
                    </label>
                    <label>Code Postal
                        <input name="postal" type="text" placeholder="J1N 3C6">
                    </label>
                </div>
            </section>
            </div>
        </form>
    </main>
    <div class="cart-total" aria-live="polite">
        <div class="cart-total-left">Total</div>
        <div class="cart-total-right"><span class="total-quantity">0</span> articles — <strong class="total-price">0.00</strong> CAD</div>
        <a href="/pages/recap.html" class="total-btn">Continuer la commande</a>
    </div>
</body>
</html>
