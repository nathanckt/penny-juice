<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commande confirmée — Penny Juice</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <nav class="navbar">
        <img src="/assets/img/logo.png" alt="Logo Penny Juice" class="logo">
    </nav>

    <main class="payment-page">
        <div class="payment-success">
            <div class="success-icon">✓</div>
            <h1>Merci — votre commande est confirmée</h1>
            <p>Nous avons bien reçu votre commande. </p>

            <div class="order-summary">
                <h3>Récapitulatif de la commande</h3>
                <ul class="payment-order-list">
                </ul>
                <div class="payment-total">Total : <strong class="payment-total-price">0.00</strong> CAD</div>
            </div>

            <a href="../index.html" class="total-btn" id="back-home-btn">Retour à l'accueil</a>
        </div>
    </main>
</body>
</html>
