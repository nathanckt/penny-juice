<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penny Juice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <nav class="navbar">
        <img src="/assets/img/logo.png" alt="Logo Penny Juice" class="logo">
    </nav>
    <main class="recap-page">
        <div class="recap-top">
            <a href="infos.html" class="back-btn">‹ Retour</a>
            <h1>RÉCAPITULATIF</h1>
        </div>

        <section class="recap-content">
            <div class="recap-box">
                <h3>COMMANDE</h3>
                <ul class="recap-order-list"> 
                </ul>
            </div>

            <div class="recap-box">
                <h3>INFORMATIONS PERSONNELLES</h3>
                <ul class="recap-personal-list">
                </ul>
            </div>

            <div class="recap-box">
                <h3>INFORMATIONS LIVRAISON</h3>
                <ul class="recap-delivery-list">
                </ul>
            </div>
        </section>
    </main>

    <div class="cart-total" aria-live="polite">
        <div class="cart-total-left">Total</div>
        <div class="cart-total-right"><span class="total-quantity">0</span> articles — <strong class="total-price">0.00</strong> CAD</div>
        <a href="/pages/paiement.html" class="total-btn">Paiement</a>
    </div>

    <script src="../script.js" defer></script>
</body>
</html>
